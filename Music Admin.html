<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --on-surface:#0A0A0A; --on-surface-var:#5F5F5F;
  --outline:#8A8A8A; --outline-var:#D4D4D4; --primary:#0A0A0A; --on-primary:#FFFFFF;
  --container:#E6E6E6; --error:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#161616; --on-surface:#F2F2F2; --on-surface-var:#A8A8A8;
    --outline:#7A7A7A; --outline-var:#333; --primary:#FFFFFF; --on-primary:#0A0A0A;
    --container:#262626; --error:#F2B8B5;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --on-surface:#F2F2F2; --on-surface-var:#A8A8A8;
  --outline:#7A7A7A; --outline-var:#333; --primary:#FFFFFF; --on-primary:#0A0A0A;
  --container:#262626; --error:#F2B8B5;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--on-surface);
  font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:64px;padding:0 16px;background:var(--surface);
  border-bottom:1px solid var(--outline-var)}
.top h1{font-size:22px;font-weight:500;margin:0;flex:1}
.ico{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-var);
  display:grid;place-items:center;cursor:pointer}
.ico-btn:hover{background:var(--container)}
main{flex:1;display:flex;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:480px;background:var(--surface);border-radius:28px;padding:24px;
  display:flex;flex-direction:column;gap:20px;align-self:flex-start}
.card h2{margin:0;font-size:24px;font-weight:400}
.card p.sub{margin:-12px 0 0;color:var(--on-surface-var);font-size:14px}

/* botão escolher música */
.pick{display:flex;align-items:center;gap:16px;width:100%;padding:16px;border-radius:20px;
  border:1.5px dashed var(--outline);background:transparent;color:var(--on-surface);cursor:pointer;text-align:left;font:inherit}
.pick:hover{background:var(--container)}
.pick .badge{width:48px;height:48px;border-radius:16px;background:var(--container);display:grid;place-items:center;flex:none}
.pick .txt{min-width:0;flex:1}
.pick .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .s{font-size:13px;color:var(--on-surface-var)}
.pick.has{border-style:solid;border-color:var(--primary)}

/* campo outlined M3 */
.field{position:relative}
.field input{width:100%;height:56px;padding:16px 16px 16px 48px;border:1px solid var(--outline);border-radius:12px;
  background:transparent;color:var(--on-surface);font:inherit;font-size:16px;outline:none}
.field input:focus{border:2px solid var(--primary);padding:15px 15px 15px 47px}
.field label{position:absolute;left:44px;top:16px;padding:0 4px;color:var(--on-surface-var);background:var(--surface);
  pointer-events:none;transition:all .15s;font-size:16px}
.field input:focus + label,.field input:not(:placeholder-shown) + label{top:-9px;font-size:12px;left:12px}
.field input:focus + label{color:var(--primary)}
.field .lead{position:absolute;left:14px;top:16px;color:var(--on-surface-var);pointer-events:none}

.preview{display:none;align-items:center;gap:12px;font-size:13px;color:var(--on-surface-var)}
.preview.on{display:flex}
.preview img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--container)}

.save{height:48px;border:0;border-radius:24px;background:var(--primary);color:var(--on-primary);font:inherit;font-weight:500;
  font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.save:disabled{background:var(--container);color:var(--on-surface-var);cursor:not-allowed}
.save:not(:disabled):hover{opacity:.88}
.bar{height:4px;border-radius:2px;background:var(--container);overflow:hidden;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;width:35%;background:var(--primary);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}

.snack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);
  background:var(--on-surface);color:var(--surface);padding:14px 20px;border-radius:12px;font-size:14px;
  max-width:calc(100% - 32px);transition:transform .25s}
.snack.on{transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <!-- Troque os SVGs inline por ícones do Flaticon (baixe em SVG e cole no lugar) -->
  <svg class="ico" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <h1>Music Admin</h1>
  <button class="ico-btn" id="theme" aria-label="Alternar tema">
    <svg class="ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main>
  <section class="card">
    <h2>Nova música</h2>
    <p class="sub">Escolha o arquivo de áudio e informe a capa. Nesta versão publicada, as músicas ficam salvas no próprio artifact.</p>

    <input type="file" id="file" accept="audio/*" hidden>
    <button class="pick" id="pick" type="button">
      <span class="badge">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      </span>
      <span class="txt">
        <div class="t" id="pickT">Escolher música</div>
        <div class="s" id="pickS">MP3, WAV, M4A…</div>
      </span>
    </button>

    <div class="field">
      <svg class="ico lead" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <input id="cover" type="url" placeholder=" " autocomplete="off" inputmode="url">
      <label for="cover">URL da imagem</label>
    </div>

    <div class="preview" id="preview"><img id="prevImg" alt=""><span>Prévia da capa</span></div>

    <div class="bar" id="bar"><i></i></div>

    <button class="save" id="save" disabled>
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
      Salvar música
    </button>
  </section>
</main>

<div class="snack" id="snack" role="status"></div>

<script>
// ===== Armazenamento do artifact (assets + db) =====
let assets = null, store = null;
(async () => {
  try {
    if (window.claude && claude.use) {
      assets = await claude.use('assets');
      store = await claude.use('db');
    }
  } catch (e) { console.error(e); }
})();

// ===== UI =====
const $ = id => document.getElementById(id);
const file = $('file'), pick = $('pick'), cover = $('cover'), save = $('save');
let chosen = null;

function toast(msg){
  const s = $('snack'); s.textContent = msg; s.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => s.classList.remove('on'), 3500);
}
function refresh(){ save.disabled = !chosen; }

pick.onclick = () => file.click();
file.onchange = () => {
  chosen = file.files[0] || null;
  pick.classList.toggle('has', !!chosen);
  $('pickT').textContent = chosen ? chosen.name : 'Escolher música';
  $('pickS').textContent = chosen ? (chosen.size/1048576).toFixed(1) + ' MB · toque para trocar' : 'MP3, WAV, M4A…';
  refresh();
};

cover.oninput = () => {
  const url = cover.value.trim();
  $('preview').classList.toggle('on', !!url);
  if (url) $('prevImg').src = url;
};
$('prevImg').onerror = () => $('preview').classList.remove('on');

$('theme').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

// ===== Salvar =====
save.onclick = async () => {
  if (!chosen) return;
  if (!assets || !store) { toast('Armazenamento indisponível nesta sessão'); return; }
  save.disabled = true; $('bar').classList.add('on');
  try {
    const up = await assets.upload(chosen);
    const id = String(Date.now());
    await store.doc('songs/' + id).set({
      title: chosen.name.replace(/\.[^.]+$/, ''),
      audio_url: up.url,
      audio_id: up.id,
      cover_url: cover.value.trim() || null,
      created_at: Date.now()
    });

    toast('Música salva');
    file.value = ''; chosen = null; cover.value = '';
    file.onchange(); cover.oninput();
  } catch (e) {
    console.error(e);
    toast('Erro ao salvar: ' + (e.message || 'tente novamente'));
  } finally {
    $('bar').classList.remove('on'); refresh();
  }
};
</script>
</body>
</html>
